<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#ee1f79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Printy">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="1788540620065.png">
<title>Printy — إدارة المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#fffcfe;
    --pink-tint:#ffe6f2;
    --purple-tint:#f2e5ff;
    --ink:#3a2b45;
    --ink-soft:#8d7a9e;
    --pink:#ff4fa0;
    --pink-deep:#ee1f79;
    --pink-soft:#ff8fc7;
    --purple:#8b3dd1;
    --purple-deep:#68219f;
    --purple-soft:#c294f5;
    --line:#f1defa;
    --profit:#189968;
    --profit-bg:#e1f7ee;
    --danger:#ef4060;
    --danger-bg:#fde3ea;
    --warn:#dd8f12;
    --warn-bg:#fdf1da;
    --shadow-pink:rgba(238,31,121,.24);
    --shadow-purple:rgba(104,33,159,.22);
    --grad-main:linear-gradient(135deg, var(--pink-deep), var(--pink) 60%, var(--purple));
    --grad-purple:linear-gradient(135deg, var(--purple-deep), var(--purple));
    --radius:19px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    min-height:100vh;
    background:
      radial-gradient(680px 420px at 108% -6%, rgba(255,143,199,.38), transparent 62%),
      radial-gradient(620px 480px at -12% 18%, rgba(139,61,209,.24), transparent 60%),
      radial-gradient(820px 620px at 50% 122%, rgba(255,182,214,.35), transparent 62%),
      linear-gradient(180deg, #fff8fc 0%, #f9eeff 50%, #f4e7ff 100%);
    font-family:'Cairo','Tahoma',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    padding-bottom:92px;
    transition:background .4s ease;
  }
  ::selection{background:var(--pink-soft); color:#fff;}
  h1,h2,h3{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif; margin:0;}
  button{font-family:inherit;}
  a{color:inherit;}

  /* ---------- App shell ---------- */
  .app{max-width:480px; margin:0 auto; position:relative; padding:0 12px;}

  .topbar{
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:60;
    margin:0 -12px; padding:13px 16px 13px;
    background:linear-gradient(180deg, rgba(255,252,254,.94), rgba(255,252,254,.88));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(241,222,250,.8);
    box-shadow:0 8px 20px rgba(139,61,209,.07);
  }
  .brand-mark{
    flex:0 0 auto; width:46px;height:46px;border-radius:15px;
    background:var(--grad-main);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 6px 16px var(--shadow-pink), inset 0 1px 1px rgba(255,255,255,.4);
    font-family:'Baloo Bhaijaan 2',sans-serif; color:#fff; font-weight:800; font-size:20px;
    position:relative;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-mark .tape{position:absolute; top:-7px; right:-15px; width:36px; height:15px; background:rgba(255,255,255,.5); transform:rotate(45deg);}
  .brand-text{flex:1; min-width:0;}
  .brand-text h1{font-size:19.5px; color:var(--ink); font-weight:800; line-height:1.15; letter-spacing:.2px;
    background:var(--grad-main); -webkit-background-clip:text; background-clip:text; color:transparent; display:inline-block;}
  .brand-text .tagline{font-size:10.5px; color:var(--ink-soft); font-weight:700; margin-top:2px;}
  .topbar-actions{flex:0 0 auto; display:flex; gap:6px;}
  .icon-btn{
    width:38px;height:38px; border-radius:13px; border:1.5px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; color:var(--purple-deep);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 3px 8px rgba(139,61,209,.08);
  }
  .icon-btn:active{background:var(--purple-tint); transform:scale(.92);}

  /* ---------- Tabs (floating pill nav w/ sliding indicator) ---------- */
  .tabnav{
    position:fixed; bottom:10px; left:0; right:0; z-index:50;
    display:flex; justify-content:center; padding:0 12px;
  }
  .tabnav-inner{
    position:relative; max-width:480px; width:100%; margin:0 auto; display:flex; justify-content:space-between;
    background:rgba(255,253,255,.86); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.7); border-radius:24px; padding:6px 6px;
    box-shadow:0 14px 34px rgba(104,33,159,.20), 0 2px 8px rgba(104,33,159,.08);
  }
  #tab-indicator{
    position:absolute; top:6px; bottom:6px; z-index:0; border-radius:18px;
    background:var(--grad-main); box-shadow:0 6px 16px var(--shadow-pink);
    transition:transform .32s cubic-bezier(.34,1.4,.64,1), width .32s cubic-bezier(.34,1.4,.64,1);
    left:0;
  }
  .tab-btn{
    position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px;
    background:none; border:none; color:var(--ink-soft); font-weight:700; font-size:10px; cursor:pointer; border-radius:16px;
    transition:color .25s ease;
  }
  .tab-btn .ic{font-size:19px; line-height:1; transition:transform .25s ease;}
  .tab-btn.active{color:#fff;}
  .tab-btn.active .ic{transform:translateY(-1px) scale(1.08);}

  .view{display:none;}
  .view.active{display:block; animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Cards / sections ---------- */
  .card{
    position:relative; background:var(--paper); border-radius:var(--radius); padding:17px 16px 15px;
    box-shadow:0 1px 2px rgba(104,33,159,.06), 0 10px 26px rgba(104,33,159,.11);
    border:1px solid #f4e6fc; margin:16px 0;
  }
  .card-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .card-title h3{font-size:14.5px; color:var(--ink); font-weight:700; display:flex; align-items:center; gap:6px;}
  .card-title .hint{font-size:10.5px; color:var(--ink-soft); font-weight:700;}

  .section-label{font-size:12px; color:var(--purple-deep); font-weight:800; margin:6px 0 9px; display:flex; align-items:center; gap:6px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;}
  .stat-card{
    position:relative; overflow:hidden;
    background:linear-gradient(160deg,#ffffff 45%,var(--pink-tint)); border-radius:17px; padding:13px 13px 11px;
    border:1px solid #ffe1f0; box-shadow:0 6px 16px rgba(238,31,121,.07);
    transition:transform .15s ease;
  }
  .stat-card:active{transform:scale(.97);}
  .stat-card.purple{background:linear-gradient(160deg,#ffffff 45%,var(--purple-tint)); border-color:#ecdcfd; box-shadow:0 6px 16px rgba(104,33,159,.08);}
  .stat-card .lbl{font-size:10.5px; color:var(--ink-soft); font-weight:700; margin-bottom:5px; display:flex; align-items:center; gap:4px;}
  .stat-card .val{font-size:17px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.1px;}
  .stat-card .val.pink{color:var(--pink-deep);}
  .stat-card .val.purple{color:var(--purple-deep);}
  .stat-card .val.profit{color:var(--profit);}

  .quick-actions{display:flex; gap:9px; margin:16px 0;}
  .qa-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:13px 6px;
    background:#fff; border:1.5px solid var(--line); border-radius:17px; font-weight:800; font-size:11px;
    color:var(--ink); cursor:pointer; box-shadow:0 4px 12px rgba(139,61,209,.06);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .qa-btn .ic{font-size:21px;}
  .qa-btn:active{background:var(--pink-tint); border-color:var(--pink-soft); transform:scale(.95);}

  .alert-box{
    display:flex; align-items:flex-start; gap:8px; background:var(--warn-bg); border:1px solid #f6d9a8;
    border-radius:15px; padding:11px 13px; margin-bottom:14px; font-size:12px; color:#8a5a10; font-weight:600;
  }
  .alert-box .ic{font-size:16px; flex:0 0 auto;}
  .alert-box a{color:var(--purple-deep); font-weight:800; text-decoration:underline; text-underline-offset:2px; cursor:pointer;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 18px; border-radius:23px; border:none; cursor:pointer; font-weight:800; font-size:13.5px;
    font-family:'Cairo',inherit; transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    position:relative;
  }
  .btn-primary{background:var(--grad-main); background-size:160% 160%; color:#fff; box-shadow:0 10px 22px var(--shadow-pink), inset 0 1px 1px rgba(255,255,255,.3);}
  .btn-primary:active{transform:scale(.96); filter:brightness(.97);}
  .btn-purple{background:var(--grad-purple); color:#fff; box-shadow:0 10px 22px var(--shadow-purple), inset 0 1px 1px rgba(255,255,255,.25);}
  .btn-purple:active{transform:scale(.96); filter:brightness(.97);}
  .btn-ghost{background:#fff; color:var(--purple-deep); border:1.5px solid var(--line); box-shadow:0 2px 8px rgba(139,61,209,.05);}
  .btn-ghost:active{background:var(--purple-tint); transform:scale(.97);}
  .btn-outline-danger{background:#fff; color:var(--danger); border:1.5px solid #f6c6cf;}
  .btn-outline-danger:active{background:var(--danger-bg); transform:scale(.97);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 13px; font-size:11.5px; border-radius:14px;}
  .fab{
    position:fixed; bottom:88px; left:50%; transform:translateX(-50%); z-index:40;
    max-width:480px;
  }

  /* ---------- Forms ---------- */
  label{display:block; font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .row2{display:flex; gap:10px;}
  .row3{display:flex; gap:8px;}
  .row2 .field, .row3 .field{flex:1; min-width:0;}
  input[type=text], input[type=number], input[type=tel], input[type=date], input[type=password],
  select, textarea{
    width:100%; font-family:'Cairo', inherit; font-size:14.5px; font-weight:700;
    padding:11px 13px; border:1.5px solid var(--line); border-radius:13px;
    background:#fffdff; color:var(--ink); transition:border-color .2s, box-shadow .2s;
  }
  textarea{font-weight:500; resize:vertical; min-height:64px; line-height:1.6;}
  select{font-weight:600;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--pink); box-shadow:0 0 0 4px rgba(255,79,160,.13);}
  input::placeholder, textarea::placeholder{color:#cdbcda; font-weight:600;}

  .seg{display:flex; background:var(--purple-tint); border-radius:15px; padding:4px; gap:3px;}
  .seg button{
    flex:1; border:none; background:transparent; padding:9px 4px; border-radius:12px; font-weight:800; font-size:12px;
    color:var(--purple-deep); cursor:pointer; transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .seg button.active{background:#fff; color:var(--pink-deep); box-shadow:0 4px 10px rgba(104,33,159,.18);}

  .chip-row{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:13px;}
  .chip{
    padding:7px 14px; border-radius:20px; font-size:11.5px; font-weight:700; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; transition:all .2s ease;
  }
  .chip.active{background:var(--grad-main); color:#fff; border-color:transparent; box-shadow:0 4px 12px var(--shadow-pink);}
  .chip.warn-chip.active{background:linear-gradient(135deg,var(--warn),#f0ad3d); box-shadow:0 4px 12px rgba(221,143,18,.3);}

  .toggle-switch{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .toggle-switch input{position:absolute; opacity:0; width:0; height:0;}
  .switch-track{position:relative; flex:0 0 auto; width:41px;height:24px; background:#e9d9f7; border-radius:20px; transition:background .25s;}
  .switch-thumb{position:absolute; top:2px;left:2px; width:20px;height:20px; background:#fff; border-radius:50%; box-shadow:0 2px 5px rgba(0,0,0,.2); transition:transform .25s;}
  .toggle-switch input:checked + .switch-track{background:var(--grad-main);}
  .toggle-switch input:checked + .switch-track .switch-thumb{transform:translateX(17px);}
  .toggle-label-text{font-size:12px; color:var(--ink); font-weight:700;}

  .search-wrap{position:relative; margin-bottom:13px;}
  .search-wrap input{padding-right:36px;}
  .search-wrap .sic{position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--ink-soft);}

  .rule{border:none; border-top:1px dashed var(--line); margin:15px 0;}
  .field-group{background:#fdf7ff; border:1px solid var(--line); border-radius:15px; padding:13px; margin-bottom:12px;}

  .repeater-row{
    display:flex; align-items:flex-start; gap:8px; background:#fff; border:1.5px solid var(--line);
    border-radius:15px; padding:11px; margin-bottom:9px; transition:border-color .2s ease;
  }
  .repeater-row .rr-main{flex:1; min-width:0;}
  .repeater-row select{margin-bottom:7px;}
  .repeater-row .rr-sub{display:flex; gap:6px;}
  .repeater-row .rr-sub input{font-size:13px; padding:8px 9px;}
  .repeater-row .rr-remove{
    flex:0 0 auto; width:27px;height:27px; border-radius:50%; border:none; background:var(--danger-bg); color:var(--danger);
    font-weight:800; cursor:pointer; margin-top:2px; transition:transform .15s ease;
  }
  .repeater-row .rr-remove:active{transform:scale(.88);}
  .rr-line-total{font-size:11px; color:var(--ink-soft); font-weight:700; margin-top:5px; text-align:left;}
  .rr-warn{font-size:10.5px; color:var(--danger); font-weight:700; margin-top:4px;}

  /* ---------- Lists (products/orders/customers) ---------- */
  .list-item{
    display:flex; align-items:center; gap:11px; background:var(--paper); border:1px solid #f4e6fc;
    border-radius:17px; padding:12px 13px; margin-bottom:10px; box-shadow:0 4px 12px rgba(104,33,159,.06); cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .list-item:active{background:#fef5fb; transform:scale(.985); box-shadow:0 2px 6px rgba(104,33,159,.08);}
  .li-avatar{
    flex:0 0 auto; width:44px;height:44px;border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:19px; background:linear-gradient(150deg,#fff,var(--pink-tint)); border:1px solid #ffe1f0; position:relative;
    box-shadow:0 3px 8px rgba(238,31,121,.08);
  }
  .li-avatar.rot{transform:rotate(-4deg);}
  .li-body{flex:1; min-width:0;}
  .li-title{font-size:13.5px; font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .li-sub{font-size:11px; color:var(--ink-soft); font-weight:600; margin-top:3px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .li-end{flex:0 0 auto; text-align:left;}
  .li-amt{font-size:13.5px; font-weight:800; color:var(--pink-deep); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .li-amt.profit{color:var(--profit);}

  .low-stock-badge{background:var(--danger-bg); color:var(--danger); font-size:9.5px; font-weight:800; padding:2px 8px; border-radius:9px;}
  .stock-badge{background:var(--profit-bg); color:var(--profit); font-size:9.5px; font-weight:800; padding:2px 8px; border-radius:9px;}

  .status-pill{font-size:9.5px; font-weight:800; padding:3.5px 10px; border-radius:9px; white-space:nowrap;}
  .status-new{background:#e3ecff; color:#3357c9;}
  .status-progress{background:var(--warn-bg); color:var(--warn);}
  .status-done{background:var(--profit-bg); color:var(--profit);}
  .status-cancelled{background:var(--danger-bg); color:var(--danger);}

  .empty-state{text-align:center; padding:38px 16px; color:var(--ink-soft); position:relative;}
  .empty-state .ic{font-size:40px; display:inline-flex; align-items:center; justify-content:center; width:76px; height:76px;
    margin-bottom:10px; border-radius:50%; background:radial-gradient(circle,var(--pink-tint),var(--purple-tint) 90%);
    box-shadow:0 6px 18px rgba(139,61,209,.10);}
  .empty-state .msg{font-size:13px; font-weight:700; margin-bottom:14px;}

  /* ---------- Totals block ---------- */
  .lineitem{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 0;}
  .lineitem .amt{font-variant-numeric:tabular-nums; font-weight:700;}
  .muted{color:var(--ink-soft); font-weight:600;}

  .total-block{
    position:relative; background:linear-gradient(180deg, var(--pink-tint), #fff0f8); margin-top:15px;
    padding:17px; border-radius:17px; overflow:hidden; border:1px solid #ffe1f0;
  }
  .total-block::before{content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:var(--grad-main);}
  .badge-row{display:flex; justify-content:space-between; align-items:center; border-radius:14px; padding:11px 14px; margin-bottom:8px; font-weight:800; font-size:14px;}
  .badge-row .amt{font-variant-numeric:tabular-nums;}
  .badge-row.total{background:#ffdcec; color:var(--pink-deep); box-shadow:inset 0 0 0 1px rgba(238,31,121,.08);}
  .badge-row.profit{background:var(--profit-bg); color:var(--profit); box-shadow:inset 0 0 0 1px rgba(24,153,104,.1);}
  .badge-row.remain{background:var(--purple-tint); color:var(--purple-deep); box-shadow:inset 0 0 0 1px rgba(104,33,159,.08);}
  .badge-row.overpaid{background:var(--profit-bg); color:var(--profit);}
  .badge-row small{display:block; font-size:10px; font-weight:700; opacity:.75;}

  /* ---------- Modal / overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(58,43,69,.5); z-index:100; display:none;
    align-items:flex-end; justify-content:center; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; transition:opacity .2s ease;
  }
  .overlay.show{display:flex; opacity:1;}
  .sheet{
    width:100%; max-width:480px; max-height:92vh; background:var(--paper); border-radius:26px 26px 0 0;
    padding:14px 17px calc(18px + env(safe-area-inset-bottom)); overflow-y:auto; position:relative;
    animation:sheetup .3s cubic-bezier(.32,.94,.6,1);
    box-shadow:0 -10px 40px rgba(58,43,69,.25);
  }
  @keyframes sheetup{from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:40px;height:4.5px; background:var(--line); border-radius:3px; margin:2px auto 13px;}
  .sheet-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;}
  .sheet-title h2{font-size:17.5px; font-weight:700; color:var(--ink);}
  .sheet-close{width:32px;height:32px; border-radius:11px; border:none; background:var(--purple-tint); color:var(--purple-deep); font-size:15px; cursor:pointer; transition:transform .15s ease;}
  .sheet-close:active{transform:scale(.9);}
  .sheet-actions{position:sticky; bottom:-2px; background:linear-gradient(180deg, transparent, var(--paper) 22%); padding:14px 0 2px; margin-top:8px; display:flex; gap:8px;}

  /* ---------- Invoice ---------- */
  .invoice{background:#fff; border-radius:18px; padding:20px; border:1px solid var(--line); box-shadow:0 10px 30px rgba(104,33,159,.10);}
  .invoice-head{display:flex; align-items:center; gap:11px; margin-bottom:11px; padding-bottom:13px; border-bottom:2px dashed var(--line);}
  .invoice-head .brand-mark{width:42px;height:42px; border-radius:13px; font-size:17px;}
  .invoice-head h3{font-size:15.5px; font-weight:800;}
  .invoice-head .inv-no{font-size:10.5px; color:var(--ink-soft); font-weight:700;}
  .invoice-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;}
  .invoice-table{width:100%; border-collapse:collapse; margin:11px 0; font-size:12px;}
  .invoice-table th{text-align:right; color:var(--ink-soft); font-weight:700; padding:5px 3px; border-bottom:1.5px solid var(--line); font-size:10.5px;}
  .invoice-table td{padding:6px 3px; border-bottom:1px solid #f6ebfb; font-weight:600;}
  .invoice-table td.num{text-align:left; font-variant-numeric:tabular-nums;}
  .invoice-perf{
    height:16px; margin:6px -20px 10px;
    background-image:radial-gradient(circle at 10px 0, transparent 9px, var(--purple-tint) 9.5px);
    background-size:20px 16px; background-repeat:repeat-x; background-position:top center;
  }
  .invoice-stamp{position:absolute; top:14px; left:16px; font-size:10px; font-weight:800; color:var(--purple-soft); border:1.5px dashed var(--purple-soft); border-radius:8px; padding:3px 9px; transform:rotate(-8deg); opacity:.75;}

<script>
/* ==================== SECTION: CONSTANTS & UTILS ==================== */
const STORAGE_KEY = 'printy_v1';

const WILAYAS = [
  '01 أدرار','02 الشلف','03 الأغواط','04 أم البواقي','05 باتنة','06 بجاية','07 بسكرة','08 بشار','09 البليدة','10 البويرة',
  '11 تمنراست','12 تبسة','13 تلمسان','14 تيارت','15 تيزي وزو','16 الجزائر','17 الجلفة','18 جيجل','19 سطيف','20 سعيدة',
  '21 سكيكدة','22 سيدي بلعباس','23 عنابة','24 قالمة','25 قسنطينة','26 المدية','27 مستغانم','28 المسيلة','29 معسكر','30 ورقلة',
  '31 وهران','32 البيض','33 إليزي','34 برج بوعريريج','35 بومرداس','36 الطارف','37 تندوف','38 تسمسيلت','39 الوادي','40 خنشلة',
  '41 سوق أهراس','42 تيبازة','43 ميلة','44 عين الدفلى','45 النعامة','46 عين تموشنت','47 غرداية','48 غليزان','49 تيميمون',
  '50 برج باجي مختار','51 أولاد جلال','52 بني عباس','53 عين صالح','54 عين قزام','55 تقرت','56 جانت','57 المغير','58 المنيعة'

const DEFAULT_CATEGORIES = ['تصاميم جرافيكية','ملصقات واستيكرات','بطاقات ودعوات','مطبوعات وفلايرز','منتجات رقمية','تغليف وهدايا','أخرى'];

const DEFAULT_MSG_TEMPLATE = 'السلام عليكم، المبلغ الإجمالي لطلبكم هو: {{total}} دج.\nبعد تأكيد الدفع نبدأ مباشرة في تنفيذ الطلب.\nشكرًا لثقتكم 🌸';
const DEFAULT_MSG_TEMPLATE_DEPOSIT = 'السلام عليكم، المبلغ الإجمالي لطلبكم هو: {{total}} دج.\nتم استلام عربون: {{deposit}} دج\nالمتبقي عند التسليم: {{remaining}} دج\nبعد تأكيد الدفع نبدأ مباشرة في تنفيذ الطلب.\nشكرًا لثقتكم 🌸';

const THEMES = {
  pinkPurple:{a:'#ff4fa0', b:'#8b3dd1', label:'وردي × بنفسجي'},
  purpleDeep:{a:'#8b3dd1', b:'#5a1f96', label:'بنفسجي ملكي'},
  pinkSoft:{a:'#ff6fb0', b:'#c060e8', label:'وردي فاتح'}
};

function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.floor(Math.random()*10000).toString(36); }

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalizeAr(str){
  return String(str==null?'':str).toLowerCase()
    .replace(/[أإآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateOnly(dtStr){ return (dtStr||'').slice(0,10); }
function monthKey(dtStr){ return (dtStr||'').slice(0,7); }
function yearKey(dtStr){ return (dtStr||'').slice(0,4); }

function fmtNum(n){
  n = Number(n)||0;
  return n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
}
// format an amount stored in DZD, respecting current display currency setting
function fmtMoney(amountDZD){
  amountDZD = Number(amountDZD)||0;
  const s = state.settings;
  if(s.currency === 'USD'){
    const usd = amountDZD / (s.usdRate||1);
    return '$' + usd.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  return Math.round(amountDZD).toLocaleString('en-US') + ' دج';
}
function fmtDZDraw(amountDZD){
  return Math.round(Number(amountDZD)||0).toLocaleString('en-US') + ' دج';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 2000);
}

function tryExecCommandCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copyToClipboard(text){
  if(tryExecCommandCopy(text)){ showToast('تم النسخ ✅'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> showToast('تم النسخ ✅')).catch(()=>{
      showToast('انسخي يدويًا 👇'); prompt('انسخي هذا النص:', text);
    });
    return;
  }
  showToast('انسخي يدويًا 👇'); prompt('انسخي هذا النص:', text);
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

function printHtml(innerHtml){
  const area = document.getElementById('print-area');
  area.innerHTML = innerHtml;
  window.print();
}

/* ==================== SECTION: DATA MODEL & STORAGE ==================== */
function defaultState(){
  return {
    settings:{
      shopName:'Printy',
      logo:null,
      theme:'pinkPurple',
      currency:'DZD',
      usdRate:260,
      messageTemplate: DEFAULT_MSG_TEMPLATE,
      lowStockDefault:3,
      nextOrderNo:1,
      lastBackupAt:null,
      notificationsEnabled:false,
      lastNotifiedDate:null
    },
    categories: DEFAULT_CATEGORIES.slice(),
    products: [],
    customers: [],
    orders: [],
    stockMovements: []
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return {
      settings: Object.assign(base.settings, parsed.settings||{}),
      categories: Array.isArray(parsed.categories) ? parsed.categories : base.categories,
      products: Array.isArray(parsed.products) ? parsed.products : [],
      customers: Array.isArray(parsed.customers) ? parsed.customers : [],
      orders: Array.isArray(parsed.orders) ? parsed.orders : [],
      stockMovements: Array.isArray(parsed.stockMovements) ? parsed.stockMovements : []
    };
  }catch(e){ return defaultState(); }
}

let state = loadState();

/* ---------- IndexedDB mirror (extra durability backup alongside localStorage) ---------- */
const IDB_NAME = 'printyDB';
const IDB_STORE = 'stateStore';
const IDB_KEY = 'currentState';
let idbInstance = null;
function idbOpen(){
  return new Promise((resolve)=>{
    if(!window.indexedDB){ resolve(null); return; }
    try{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{ try{ req.result.createObjectStore(IDB_STORE); }catch(e){} };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
}
async function idbSaveState(stateObj){
  try{
    if(!idbInstance) idbInstance = await idbOpen();
    if(!idbInstance) return;
    const tx = idbInstance.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(JSON.stringify(stateObj), IDB_KEY);
  }catch(e){ /* best-effort only, never block the UI on this */ }
}
async function idbLoadState(){
  try{
    if(!idbInstance) idbInstance = await idbOpen();
    if(!idbInstance) return null;
    return await new Promise((resolve)=>{
      const tx = idbInstance.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = ()=> resolve(req.result ? JSON.parse(req.result) : null);
      req.onerror = ()=> resolve(null);
    });
  }catch(e){ return null; }
}
function stateLooksEmpty(s){
  return !s || (!s.products.length && !s.customers.length && !s.orders.length);
}
// If localStorage came back empty (cleared by the browser/user) but IndexedDB still has data, recover automatically.
async function recoverFromIndexedDbIfNeeded(){
  if(!stateLooksEmpty(state)) { idbSaveState(state); return; }
  const recovered = await idbLoadState();
  if(recovered && !stateLooksEmpty(recovered)){
    state = recovered;
    saveState();
    applyTheme();
    renderAll();
    showToast('تم استرجاع بياناتك تلقائيًا ✅');
  }
}
function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().catch(()=>{});
    }
  }catch(e){}
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showToast('تعذر الحفظ محليًا — تحققي من مساحة التخزين'); }
  idbSaveState(state); // silent mirror backup, best-effort
}

/* ---------- notifications (local, permission-based) ---------- */
function notificationsSupported(){ return typeof Notification !== 'undefined'; }
function requestNotificationPermission(cb){
  if(!notificationsSupported()){ showToast('المتصفح ما يدعمش الإشعارات'); return; }
  Notification.requestPermission().then(perm=>{
    state.settings.notificationsEnabled = (perm === 'granted');
    saveState();
    if(cb) cb(perm);
  });
}
function fireLocalNotification(title, body){
  if(!notificationsSupported() || Notification.permission !== 'granted') return;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if(reg && reg.showNotification){ reg.showNotification(title, {body, icon:'icon-192.png'}); }
        else { new Notification(title, {body}); }
      }).catch(()=>{ try{ new Notification(title, {body}); }catch(e){} });
    } else {
      new Notification(title, {body});
    }
  }catch(e){}
}
function checkLowStockNotification(){
  if(!state.settings.notificationsEnabled || !notificationsSupported() || Notification.permission!=='granted') return;
  const today = todayStr();
  if(state.settings.lastNotifiedDate === today) return; // once per day max
  const lowStock = state.products.filter(p=> (p.stock||0) <= (p.lowStockThreshold ?? state.settings.lowStockDefault));
  if(lowStock.length){
    fireLocalNotification('🌸 Printy — تنبيه مخزون', `عندك ${lowStock.length} منتج مخزونه منخفض، تفقّديه من التطبيق.`);
    state.settings.lastNotifiedDate = today;
    saveState();
  }
}

/* ---------- backup reminder ---------- */
function daysSince(iso){
  if(!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / 86400000;
}
function markBackupDone(){
  state.settings.lastBackupAt = new Date().toISOString();
  saveState();
}
function backupIsOverdue(){
  const hasData = !stateLooksEmpty(state);
  return hasData && daysSince(state.settings.lastBackupAt) >= 7;
}

/* ---------- lookups ---------- */
function findProduct(id){ return state.products.find(p=>p.id===id); }
function findCustomer(id){ return state.customers.find(c=>c.id===id); }
function findOrder(id){ return state.orders.find(o=>o.id===id); }

/* ---------- stock helpers ---------- */
function addStockMovement(productId, productName, type, qtyDelta, note){
  state.stockMovements.unshift({
    id: uid('mv'), date: new Date().toISOString(), productId, productName, type, qty: qtyDelta, note: note||''
  });
}
function applyOrderStockDelta(order, sign){
  // sign = -1 to deduct stock (order placed), +1 to restore stock (order cancelled/deleted)
  order.items.forEach(item=>{
    if(!item.productId) return;
    const p = findProduct(item.productId);
    if(!p) return;
    p.stock = (p.stock||0) + sign * item.qty;
    addStockMovement(p.id, p.name, sign<0?'sale':'cancel', sign*item.qty, sign<0?('طلب #'+order.orderNo):('استرجاع من طلب #'+order.orderNo));
  });
}

/* ---------- order totals ---------- */
function computeOrderTotals(order){
  const subtotal = order.items.reduce((s,i)=> s + (Number(i.qty)||0)*(Number(i.unitPrice)||0), 0);
  let discount = 0;
  if(order.discountType === 'percent'){ discount = subtotal * (Number(order.discountValue)||0) / 100; }
  else { discount = Number(order.discountValue)||0; }
  discount = Math.min(Math.max(discount,0), subtotal);
  const afterDiscount = subtotal - discount;

  const exp = order.expenses||{};
  const shippingCost = Number(exp.shipping)||0;
  const shippingCharged = exp.shippingOnCustomer ? shippingCost : 0;
  const customerTotal = afterDiscount + shippingCharged;

  const itemsCost = order.items.reduce((s,i)=> s + (Number(i.qty)||0)*(Number(i.unitCost)||0), 0);
  const customExpensesSum = (exp.custom||[]).reduce((s,c)=> s + (Number(c.amount)||0), 0);
  const extraExpenses = (Number(exp.design)||0)+(Number(exp.printing)||0)+(Number(exp.materials)||0)+shippingCost+(Number(exp.paymentFees)||0)+(Number(exp.ads)||0)+customExpensesSum;
  const totalCost = itemsCost + extraExpenses;

  const netProfit = customerTotal - totalCost;
  const marginPct = customerTotal>0 ? (netProfit/customerTotal*100) : 0;
  const deposit = Number(order.deposit)||0;
  const remaining = customerTotal - deposit;

  return {subtotal,discount,afterDiscount,shippingCost,shippingCharged,customerTotal,itemsCost,customExpensesSum,extraExpenses,totalCost,netProfit,marginPct,deposit,remaining};
}

function statusLabel(st){
  return {new:'جديد', progress:'قيد التنفيذ', done:'مكتمل', cancelled:'ملغى'}[st] || st;
}
function statusClass(st){
  return {new:'status-new', progress:'status-progress', done:'status-done', cancelled:'status-cancelled'}[st] || '';
}

/* ==================== SECTION: NAVIGATION & MODALS ==================== */
let activeTab = 'home';
const renderers = {}; // tab -> render function

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  let activeBtn = null;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const isActive = b.dataset.tab===tab;
    b.classList.toggle('active', isActive);
    if(isActive) activeBtn = b;
  });
  moveTabIndicator(activeBtn);
  if(renderers[tab]) renderers[tab]();
  window.scrollTo(0,0);
}
function moveTabIndicator(btn){
  const indicator = document.getElementById('tab-indicator');
  if(!indicator || !btn) return;
  indicator.style.width = btn.offsetWidth + 'px';
  indicator.style.transform = `translateX(${btn.offsetLeft}px)`;
}
window.addEventListener('resize', ()=>{
  const activeBtn = document.querySelector('.tab-btn.active');
  if(activeBtn) moveTabIndicator(activeBtn);
});
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});

function openSheet(id, titleHtml, bodyHtml, opts){
  opts = opts||{};
  const root = document.getElementById('modals-root');
  let overlay = document.getElementById(id);
  if(overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = id;
  overlay.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-title"><h2>${titleHtml}</h2><button class="sheet-close" data-close-sheet="${id}">✕</button></div>
      <div class="sheet-body">${bodyHtml}</div>
    </div>`;
  root.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay && !opts.noBackdropClose) closeSheet(id); });
  overlay.querySelector('[data-close-sheet]').addEventListener('click', ()=> closeSheet(id));
  requestAnimationFrame(()=> overlay.classList.add('show'));
  return overlay;
}
function closeSheet(id){
  const overlay = document.getElementById(id);
  if(!overlay) return;
  overlay.classList.remove('show');
  setTimeout(()=> overlay.remove(), 200);
}

function confirmAction(msg){ return window.confirm(msg); }

/* ---------- global search ---------- */
document.getElementById('open-search-btn').addEventListener('click', openGlobalSearch);
function openGlobalSearch(){
  const body = `
    <div class="search-wrap"><input type="text" id="gs-input" placeholder="ابحثي عن طلب، منتج، أو زبون..." autofocus><span class="sic">🔎</span></div>
    <div id="gs-results"></div>`;
  openSheet('sheet-search', '🔎 بحث شامل', body);
  const input = document.getElementById('gs-input');
  input.addEventListener('input', ()=> renderGlobalSearch(input.value));
  renderGlobalSearch('');
}
function renderGlobalSearch(q){

  const nq = normalizeAr(q);
  if(!nq){ results.innerHTML = '<div class="empty-state"><span class="ic">🔎</span><div class="msg">اكتبي اسم منتج، زبون، أو رقم طلب</div></div>'; return; }
  let html = '';
  const orders = state.orders.filter(o=>{
    const cust = o.customerSnapshot||{};
    return normalizeAr(o.orderNo).includes(nq) || normalizeAr(cust.name).includes(nq) || normalizeAr(cust.phone).includes(nq);
  }).slice(0,8);
  const products = state.products.filter(p=> normalizeAr(p.name).includes(nq)).slice(0,8);
  const customers = state.customers.filter(c=> normalizeAr(c.name).includes(nq) || normalizeAr(c.phone).includes(nq)).slice(0,8);

    orders.forEach(o=>{

      html += `<div class="list-item" data-open-order="${o.id}"><div class="li-avatar">🧾</div><div class="li-body"><div class="li-title">#${escapeHtml(o.orderNo)} — ${escapeHtml((o.customerSnapshot||{}).name||'بدون اسم')}</div><div class="li-sub"><span class="status-pill ${statusClass(o.status)}">${statusLabel(o.status)}</span></div></div><div class="li-end"><div class="li-amt">${fmtMoney(t.customerTotal)}</div></div></div>`;
    });
  }
  if(products.length){
    html += '<div class="section-label">📦 منتجات</div>';
    products.forEach(p=>{
      html += `<div class="list-item" data-open-product="${p.id}"><div class="li-avatar">🎨</div><div class="li-body"><div class="li-title">${escapeHtml(p.name)}</div><div class="li-sub">${escapeHtml(p.category||'')}</div></div><div class="li-end"><div class="li-amt">${fmtMoney(p.sellPrice)}</div></div></div>`;
    });
  }
  if(customers.length){
    html += '<div class="section-label">👤 زبائن</div>';
    customers.forEach(c=>{
      html += `<div class="list-item" data-open-customer="${c.id}"><div class="li-avatar">👤</div><div class="li-body"><div class="li-title">${escapeHtml(c.name)}</div><div class="li-sub">${escapeHtml(c.phone||'')}</div></div></div>`;
    });
  }
  if(!orders.length && !products.length && !customers.length){
    html = '<div class="empty-state"><span class="ic">🤷‍♀️</span><div class="msg">ما لقيتش نتائج</div></div>';
  }
  results.innerHTML = html;
  results.querySelectorAll('[data-open-order]').forEach(el=> el.addEventListener('click', ()=>{ closeSheet('sheet-search'); switchTab('orders'); openOrderDetail(el.dataset.openOrder); }));
  results.querySelectorAll('[data-open-product]').forEach(el=> el.addEventListener('click', ()=>{ closeSheet('sheet-search'); switchTab('products'); openProductForm(el.dataset.openProduct); }));
  results.querySelectorAll('[data-open-customer]').forEach(el=> el.addEventListener('click', ()=>{ closeSheet('sheet-search'); switchTab('orders'); ordersSubView='customers'; renderOrdersView(); setTimeout(()=>openCustomerForm(el.dataset.openCustomer),50); }));
}

/* ---------- color utils (for dynamic theme ramps) ---------- */
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=> Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mixHex(hex1, hex2, t){ // t=0 -> hex1, t=1 -> hex2
  const a = hexToRgb(hex1), b = hexToRgb(hex2);
  return rgbToHex(a.r+(b.r-a.r)*t, a.g+(b.g-a.g)*t, a.b+(b.b-a.b)*t);
}
function lighten(hex, t){ return mixHex(hex, '#ffffff', t); }
function darken(hex, t){ return mixHex(hex, '#000000', t); }
function hexToRgba(hex, alpha){ const c = hexToRgb(hex); return `rgba(${c.r},${c.g},${c.b},${alpha})`; }

/* ---------- brand mark / theme application ---------- */
function applyTheme(){
  const t = THEMES[state.settings.theme] || THEMES.pinkPurple;
  const root = document.documentElement.style;
  const pink = t.a, purple = t.b;
  root.setProperty('--pink', pink);
  root.setProperty('--purple', purple);
  root.setProperty('--pink-deep', darken(pink, .14));
  root.setProperty('--pink-soft', lighten(pink, .22));
  root.setProperty('--pink-tint', lighten(pink, .87));
  root.setProperty('--purple-deep', darken(purple, .16));
  root.setProperty('--purple-soft', lighten(purple, .24));
  root.setProperty('--purple-tint', lighten(purple, .89));
  root.setProperty('--line', lighten(mixHex(pink,purple,.5), .88));
  root.setProperty('--shadow-pink', hexToRgba(darken(pink,.1), .26));
  root.setProperty('--shadow-purple', hexToRgba(darken(purple,.1), .24));
  root.setProperty('--grad-main', `linear-gradient(135deg, ${darken(pink,.14)}, ${pink} 60%, ${purple})`);
  root.setProperty('--grad-purple', `linear-gradient(135deg, ${darken(purple,.16)}, ${purple})`);

  const mark = document.getElementById('brand-mark');
  document.getElementById('shop-name-display').textContent = state.settings.shopName || 'Printy';
  if(state.settings.logo){
    mark.innerHTML = `<img src="${state.settings.logo}" alt="logo">`;
  } else {
    mark.innerHTML = `<span class="tape"></span><span>${escapeHtml((state.settings.shopName||'R').trim().charAt(0).toUpperCase())}</span>`;
  }
}

let productSearchQ = '';
let productLowStockOnly = false;

  }

  html += `<div class="search-wrap"><input type="text" id="prod-search" placeholder="ابحثي عن منتج..." value="${escapeHtml(productSearchQ)}"><span class="sic">🔎</span></div>`;

    + `<button type="button" class="chip warn-chip ${productLowStockOnly?'active':''}" id="chip-lowstock-only">⚠️ منخفض فقط</button></div>`;

  document.getElementById('btn-stock-log').addEventListener('click', openStockLog);

  if(lowBtn) lowBtn.addEventListener('click', ()=>{ productLowStockOnly=true; renderProductsView(); });
  document.getElementById('prod-search').addEventListener('input', (e)=>{ productSearchQ = e.target.value; renderProductList(); });
  document.getElementById('chip-lowstock-only').addEventListener('click', ()=>{ productLowStockOnly = !productLowStockOnly; renderProductsView(); });
  document.querySelectorAll('#prod-cat-chips .chip[data-cat]').forEach(chip=>{
    chip.addEventListener('click', ()=>{ productFilterCat = chip.dataset.cat; productLowStockOnly=false; renderProductsView(); });

function renderProductList(){
  const list = document.getElementById('prod-list');
  if(!list) return;
  const nq = normalizeAr(productSearchQ);
  let items = state.products.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  if(productLowStockOnly){
    items = items.filter(p=> (p.stock||0) <= (p.lowStockThreshold ?? state.settings.lowStockDefault));
  } else if(productFilterCat !== 'الكل'){
    items = items.filter(p=> p.category === productFilterCat);
  }
  if(nq) items = items.filter(p=> normalizeAr(p.name).includes(nq));

  if(!items.length){
    const msg = productLowStockOnly ? 'ولا منتج مخزونه منخفض حاليًا 🎉' : 'ما كاين حتى منتج هنا بعد';
    list.innerHTML = `<div class="empty-state"><span class="ic">${productLowStockOnly?'🎉':'🎨'}</span><div class="msg">${msg}</div></div>`;
    return;
  }
  list.innerHTML = items.map(p=>{
    const low = (p.stock||0) <= (p.lowStockThreshold ?? state.settings.lowStockDefault);
    const margin = p.sellPrice>0 ? Math.round(((p.sellPrice-p.costPrice)/p.sellPrice)*100) : 0;
    return `<div class="list-item" data-open-product="${p.id}">
      <div class="li-avatar rot">🎨</div>
      <div class="li-body">
        <div class="li-title">${escapeHtml(p.name)}</div>
        <div class="li-sub"><span>${escapeHtml(p.category||'—')}</span> · <span>هامش ${margin}%</span> ${low?`<span class="low-stock-badge">مخزون منخفض</span>`:`<span class="stock-badge">متوفر ${p.stock||0}</span>`}</div>
      </div>
      <div class="li-end"><div class="li-amt">${fmtMoney(p.sellPrice)}</div></div>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-open-product]').forEach(el=> el.addEventListener('click', ()=> openProductForm(el.dataset.openProduct)));
}

      </div>
    </div>
    <hr class="rule">

      <button type="button" data-mode="calc" class="${(!isEdit || p.profitMethod) ? 'active':''}">احسبي السعر من التكلفة</button>
      <button type="button" data-mode="manual" class="${(isEdit && !p.profitMethod) ? 'active':''}">أدخلي السعر يدويًا</button>
    </div>
    <div class="field" style="margin-top:12px;">
      <label>تكلفة الشراء / الإنتاج (دج) *</label>
      <input type="number" id="pf-cost" min="0" step="1" value="${p?p.costPrice:0}">
    </div>
    <div id="pf-calc-block" style="display:${(isEdit && !p.profitMethod)?'none':'block'};">
      <div class="row2">
        <div class="field">
          <label>طريقة الربح</label>
          <div class="seg" id="pf-profit-seg">
            <button type="button" data-pm="percent" class="${!(isEdit&&p.profitMethod==='fixed')?'active':''}">نسبة %</button>
            <button type="button" data-pm="fixed" class="${(isEdit&&p.profitMethod==='fixed')?'active':''}">مبلغ ثابت</button>
          </div>
        </div>
        <div class="field">
          <label id="pf-profit-val-lbl">${(isEdit&&p.profitMethod==='fixed')?'مبلغ الربح الثابت (دج)':'نسبة الربح (%)'}</label>
          <input type="number" id="pf-profit-val" min="0" step="1" value="${p?(p.profitMethod==='fixed'?(p.profitValue||0):(p.profitValue||30)):30}">
        </div>
      </div>
      <div class="lineitem"><span class="muted">💡 السعر المقترح</span><span class="amt" id="pf-suggested-price">0 دج</span></div>
    </div>
    <div class="field" id="pf-manual-block" style="display:${(isEdit && !p.profitMethod)?'block':'none'};">
      <label>سعر البيع (دج) *</label>
      <input type="number" id="pf-sell-manual" min="0" step="1" value="${p?p.sellPrice:0}">
    </div>
    <div class="lineitem" id="pf-margin-note" style="padding-top:0;"></div>
    <hr class="rule">
    <div class="row2">
      <div class="field">
        <label>الكمية المتوفرة</label>
        <input type="number" id="pf-stock" min="0" step="1" value="${p?p.stock:0}">
      </div>
      <div class="field">
        <label>تنبيه عند الانخفاض تحت</label>
        <input type="number" id="pf-lowstock" min="0" step="1" value="${p?(p.lowStockThreshold ?? state.settings.lowStockDefault):state.settings.lowStockDefault}">
      </div>
    </div>
    <div class="sheet-actions">
      ${isEdit?'<button class="btn btn-outline-danger" id="pf-delete">🗑️ حذف</button>':''}
      <button class="btn btn-primary btn-block" id="pf-save">${isEdit?'💾 حفظ التعديلات':'✨ إضافة المنتج'}</button>
    </div>`;
  openSheet('sheet-product', isEdit?'✏️ تعديل منتج':'✨ منتج جديد', body);

  const sellInputFinal = ()=> document.getElementById('pf-sell-manual');
  let mode = (isEdit && !p.profitMethod) ? 'manual' : 'calc';
  let profitMethod = (isEdit && p.profitMethod==='fixed') ? 'fixed' : 'percent';

  function updateSuggested(){
    const cost = parseFloat(document.getElementById('pf-cost').value)||0;
    const val = parseFloat(document.getElementById('pf-profit-val').value)||0;
    let price = profitMethod==='percent' ? cost*(1+val/100) : cost+val;
    price = Math.max(0, Math.round(price));
    document.getElementById('pf-suggested-price').textContent = fmtDZDraw(price);
    updateMarginNote();
    return price;
  }
  function updateMarginNote(){
    const cost = parseFloat(document.getElementById('pf-cost').value)||0;
    let sell;
    if(mode==='manual'){
      sell = parseFloat(document.getElementById('pf-sell-manual').value)||0;
    } else {
      const val = parseFloat(document.getElementById('pf-profit-val').value)||0;
      sell = profitMethod==='percent' ? cost*(1+val/100) : cost+val;
    }
    const el = document.getElementById('pf-margin-note');
    if(!el) return;
    if(sell <= 0 && cost <= 0){ el.innerHTML = ''; return; }
    const profit = sell - cost;
    const margin = sell>0 ? (profit/sell*100) : 0;
    if(profit < 0){
      el.innerHTML = `<span class="muted" style="color:var(--danger); font-weight:800;">⚠️ سعر البيع أقل من التكلفة</span><span class="amt" style="color:var(--danger);">${fmtDZDraw(profit)}</span>`;
    } else {
      el.innerHTML = `<span class="muted">🪙 هامش الربح</span><span class="amt" style="color:var(--profit);">${margin.toFixed(0)}% (${fmtDZDraw(profit)})</span>`;
    }
  }
  document.getElementById('pf-cost').addEventListener('input', updateSuggested);
  document.getElementById('pf-profit-val').addEventListener('input', updateSuggested);
  document.getElementById('pf-sell-manual').addEventListener('input', updateMarginNote);

  document.querySelectorAll('#pf-profit-seg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      profitMethod = btn.dataset.pm;
      document.querySelectorAll('#pf-profit-seg button').forEach(b=>b.classList.toggle('active', b===btn));
      document.getElementById('pf-profit-val-lbl').textContent = profitMethod==='percent' ? 'نسبة الربح (%)' : 'مبلغ الربح الثابت (دج)';
      updateSuggested();
    });
  });
  document.querySelectorAll('#pf-mode-seg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      mode = btn.dataset.mode;
      document.querySelectorAll('#pf-mode-seg button').forEach(b=>b.classList.toggle('active', b===btn));
      document.getElementById('pf-calc-block').style.display = mode==='calc' ? 'block' : 'none';
      document.getElementById('pf-manual-block').style.display = mode==='manual' ? 'block' : 'none';
      updateMarginNote();
    });
  });
  document.getElementById('pf-new-cat').addEventListener('click', ()=>{
    const name = prompt('اسم التصنيف الجديد:');
    if(!name) return;
    if(!state.categories.includes(name)) state.categories.push(name);
    saveState();
    const sel = document.getElementById('pf-cat');
    sel.innerHTML = state.categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    sel.value = name;
  });

  updateSuggested();

  document.getElementById('pf-save').addEventListener('click', ()=>{
    const name = document.getElementById('pf-name').value.trim();
    if(!name){ showToast('دخّلي اسم المنتج'); return; }
    const cost = Math.max(0, parseFloat(document.getElementById('pf-cost').value)||0);
    const profitVal = Math.max(0, parseFloat(document.getElementById('pf-profit-val').value)||0);
    let sellPrice;
    if(mode==='manual'){
      sellPrice = Math.max(0, parseFloat(document.getElementById('pf-sell-manual').value)||0);
    } else {
      sellPrice = updateSuggested();
    }
    const stock = Math.max(0, parseFloat(document.getElementById('pf-stock').value)||0);
    const lowstock = Math.max(0, parseFloat(document.getElementById('pf-lowstock').value)||0);
    const cat = document.getElementById('pf-cat').value;

    if(isEdit){
      const prevStock = p.stock||0;
      Object.assign(p, {name, category:cat, costPrice:cost, sellPrice, profitMethod:mode==='manual'?null:profitMethod, profitValue:mode==='manual'?null:profitVal, stock, lowStockThreshold:lowstock});
      if(stock !== prevStock){
        addStockMovement(p.id, p.name, 'adjust', stock-prevStock, 'تعديل يدوي من نموذج المنتج');
      }
      showToast('تم تحديث المنتج ✅');
    } else {
      const np = {id:uid('prod'), name, category:cat, costPrice:cost, sellPrice, profitMethod:mode==='manual'?null:profitMethod, profitValue:mode==='manual'?null:profitVal, stock, lowStockThreshold:lowstock, createdAt:new Date().toISOString()};
      state.products.push(np);
      if(stock>0) addStockMovement(np.id, np.name, 'restock', stock, 'رصيد ابتدائي');
      showToast('تمت إضافة المنتج ✨');
    }
    saveState();
    closeSheet('sheet-product');
    renderProductsView();
    if(renderers.home) renderers.home();
  });

  if(isEdit){
    document.getElementById('pf-delete').addEventListener('click', ()=>{
      const usedInOrders = state.orders.some(o=> o.items.some(i=>i.productId===p.id));
      const msg = usedInOrders ? 'هذا المنتج مرتبط بطلبات سابقة. حذفه لن يمسح الطلبات القديمة لكنه سيوقف ظهوره في المنتجات. متأكدة؟' : 'حذف هذا المنتج نهائيًا؟';
      if(!confirmAction(msg)) return;
      state.products = state.products.filter(x=>x.id!==p.id);
      saveState();
      closeSheet('sheet-product');
      renderProductsView();
      if(renderers.home) renderers.home();
      showToast('تم الحذف 🗑️');
    });
  }
}

function customerOrderStats(customerId){
  const orders = state.orders.filter(o=> o.customerId===customerId && o.status!=='cancelled');
  const total = orders.reduce((s,o)=> s + computeOrderTotals(o).customerTotal, 0);
  return {count: orders.length, total};
}

  const sub = document.getElementById('orders-subwrap');
  const nq = normalizeAr(customerSearchQ);
  let list = state.customers.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));

    html += list.map(c=>{

/* ---------- Orders list ---------- */
function renderOrdersList(){
  const sub = document.getElementById('orders-subwrap');
  const nq = normalizeAr(orderSearchQ);
  let list = state.orders.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  if(orderStatusFilter !== 'الكل'){
    const map = {'جديد':'new','قيد التنفيذ':'progress','مكتمل':'done','ملغى':'cancelled'};
    list = list.filter(o=> o.status === map[orderStatusFilter]);
  }
  if(nq){
    list = list.filter(o=>{
      const cust = o.customerSnapshot||{};
      return normalizeAr(o.orderNo).includes(nq) || normalizeAr(cust.name).includes(nq) || normalizeAr(cust.phone).includes(nq);
    });
  }
  let html = `<div class="search-wrap"><input type="text" id="ord-search" placeholder="ابحثي برقم الطلب أو اسم الزبون..." value="${escapeHtml(orderSearchQ)}"><span class="sic">🔎</span></div>`;
  html += '<div class="chip-row" id="ord-status-chips">' + ['الكل','جديد','قيد التنفيذ','مكتمل','ملغى'].map(s=>`<button type="button" class="chip ${s===orderStatusFilter?'active':''}" data-status="${s}">${s}</button>`).join('') + '</div>';
  html += '<div id="ord-list">';
  if(!list.length){
    html += `<div class="empty-state"><span class="ic">🛍️</span><div class="msg">${state.orders.length?'ما لقيتش طلبات مطابقة':'أنشئي أول طلب لمتجرك ✨'}</div></div>`;
  } else {
    html += list.map(o=>{
      const t = computeOrderTotals(o);
      const cust = o.customerSnapshot||{};
      const itemCount = o.items.length;
      return `<div class="list-item" data-open-order="${o.id}">
        <div class="li-avatar">🧾</div>
        <div class="li-body"><div class="li-title">#${escapeHtml(o.orderNo)} — ${escapeHtml(cust.name||'بدون اسم')}</div>
        <div class="li-sub"><span class="status-pill ${statusClass(o.status)}">${statusLabel(o.status)}</span><span>${itemCount} عنصر</span><span>${escapeHtml(dateOnly(o.date))}</span></div></div>
        <div class="li-end"><div class="li-amt">${fmtMoney(t.customerTotal)}</div><div class="li-amt profit" style="font-size:11px;">ربح ${fmtMoney(t.netProfit)}</div></div>
      </div>`;
    }).join('');
  }
  html += '</div><button class="btn btn-primary btn-block" id="btn-add-order" style="margin-top:6px;">+ طلب جديد</button>';
  sub.innerHTML = html;
  document.getElementById('ord-search').addEventListener('input', (e)=>{ orderSearchQ = e.target.value; renderOrdersList(); });
  sub.querySelectorAll('#ord-status-chips .chip').forEach(chip=> chip.addEventListener('click', ()=>{ orderStatusFilter = chip.dataset.status; renderOrdersList(); }));
  document.getElementById('btn-add-order').addEventListener('click', ()=> openOrderForm());
  sub.querySelectorAll('[data-open-order]').forEach(el=> el.addEventListener('click', ()=> openOrderDetail(el.dataset.openOrder)));
}

function setOrderStatus(order, newStatus){
  if(order.status === newStatus) return;
  const wasCancelled = order.status === 'cancelled';
  const willCancel = newStatus === 'cancelled';
  if(!wasCancelled && willCancel && order.stockApplied){
    applyOrderStockDelta(order, +1);
    order.stockApplied = false;
  } else if(wasCancelled && !willCancel && !order.stockApplied){
    applyOrderStockDelta(order, -1);
    order.stockApplied = true;
  }
  order.status = newStatus;
  order.updatedAt = new Date().toISOString();
  saveState();
}

function buildCustomerMessage(order){
  const t = computeOrderTotals(order);
  const cust = order.customerSnapshot||{};
  let tmpl = state.settings.messageTemplate || DEFAULT_MSG_TEMPLATE;
  return tmpl
    .replace(/\{\{total\}\}/g, fmtNum(t.customerTotal))
    .replace(/\{\{deposit\}\}/g, fmtNum(t.deposit))
    .replace(/\{\{remaining\}\}/g, fmtNum(t.remaining))
    .replace(/\{\{name\}\}/g, cust.name||'');
}

function itemStockWarningHtml(item){
  if(!item.productId) return '';
  const p = findProduct(item.productId);
  if(!p) return '';
  if((item.qty||0) > (p.stock||0)) return `⚠️ الكمية أكبر من المتوفر (${p.stock||0})`;
  return '';
}
function renderOrderItemsBlock(){
  const wrap = document.getElementById('of-items');
  if(!orderFormState.items.length){
    wrap.innerHTML = `<div class="empty-state" style="padding:16px;"><span class="ic">🛍️</span><div class="msg">زيدي منتج أو عنصر مخصص</div></div>`;
    return;
  }
  wrap.innerHTML = orderFormState.items.map((it,idx)=>{
    const isCustom = !it.productId;
    return `<div class="repeater-row" data-idx="${idx}">
      <div class="rr-main">
        <select class="rr-product" data-idx="${idx}">${buildProductOptions(it.productId)}</select>
        <input class="rr-custom-name" data-idx="${idx}" type="text" placeholder="اسم العنصر المخصص" value="${escapeHtml(it.name)}" style="display:${isCustom?'block':'none'}; margin-bottom:6px;">
        <div class="rr-sub">
          <input class="rr-qty" data-idx="${idx}" type="number" min="1" step="1" placeholder="كمية" value="${it.qty}">
          <input class="rr-price" data-idx="${idx}" type="number" min="0" step="1" placeholder="سعر البيع" value="${it.unitPrice}">
          <input class="rr-cost" data-idx="${idx}" type="number" min="0" step="1" placeholder="التكلفة" value="${it.unitCost}">
        </div>
        <div class="rr-line-total" data-idx="${idx}">المجموع: ${fmtDZDraw(it.qty*it.unitPrice)}</div>
        <div class="rr-warn" data-warn-idx="${idx}">${itemStockWarningHtml(it)}</div>
      </div>

    const idx = +e.target.dataset.idx;
    const val = e.target.value;
    const item = orderFormState.items[idx];
    if(val === '__custom__'){ item.productId = null; item.name = item.name||''; }
    else{
      const p = findProduct(val);
      item.productId = p.id; item.name = p.name; item.unitPrice = p.sellPrice; item.unitCost = p.costPrice;
    }
    renderOrderItemsBlock();
    updateOrderFormTotals();
  }));
  wrap.querySelectorAll('.rr-custom-name').forEach(inp=> inp.addEventListener('input', (e)=>{
    orderFormState.items[+e.target.dataset.idx].name = e.target.value;
  }));
  wrap.querySelectorAll('.rr-qty').forEach(inp=> inp.addEventListener('input', (e)=>{
    const idx = +e.target.dataset.idx;
    orderFormState.items[idx].qty = Math.max(0, parseFloat(e.target.value)||0);
    updateItemLineTotal(idx); updateItemWarning(idx); updateOrderFormTotals();
  }));
  wrap.querySelectorAll('.rr-price').forEach(inp=> inp.addEventListener('input', (e)=>{
    const idx = +e.target.dataset.idx;
    orderFormState.items[idx].unitPrice = Math.max(0, parseFloat(e.target.value)||0);
    updateItemLineTotal(idx); updateOrderFormTotals();
  }));
  wrap.querySelectorAll('.rr-cost').forEach(inp=> inp.addEventListener('input', (e)=>{
    const idx = +e.target.dataset.idx;
    orderFormState.items[idx].unitCost = Math.max(0, parseFloat(e.target.value)||0);
    updateOrderFormTotals();
  }));
  wrap.querySelectorAll('.rr-remove').forEach(btn=> btn.addEventListener('click', (e)=>{

function saveOrderForm(existing){
  // customer resolution
  let customerId = null, snapshot;
  if(orderFormCustomerMode === 'existing'){
    customerId = orderFormState.customerId;
    if(!customerId){ showToast('اختاري زبون أو أضيفي زبون جديد'); return; }
    const c = findCustomer(customerId);
    if(!c){ showToast('هذا الزبون لم يعد موجودًا — رجّعي واختاري "زبون جديد"'); return; }
    snapshot = {name:c.name, phone:c.phone, wilaya:c.wilaya, address:c.address, notes:c.notes};
  } else {
    const snap = orderFormState.customerSnapshot;
    if(!snap.name || !snap.name.trim()){ showToast('دخّلي اسم الزبون'); return; }
    const nc = {id:uid('cust'), createdAt:new Date().toISOString(), name:snap.name.trim(), phone:snap.phone||'', wilaya:snap.wilaya||'', address:snap.address||'', notes:''};
    state.customers.push(nc);
    customerId = nc.id;
    snapshot = {name:snap.name.trim(), phone:snap.phone||'', wilaya:snap.wilaya||'', address:snap.address||'', notes:''};
  }
  if(!orderFormState.items.length){ showToast('زيدي منتج واحد على الأقل'); return; }
  for(const it of orderFormState.items){
    if(!it.name || !it.name.trim()){ showToast('كمّلي اسم كل عنصر في الطلب'); return; }
  }

  const date = document.getElementById('of-date').value || todayStr();
  const notes = document.getElementById('of-notes').value.trim();
  const status = document.getElementById('of-status').value;

  const newOrderData = {
    customerId, customerSnapshot: snapshot, date, notes, status,
    items: orderFormState.items.map(it=>({id:it.id||uid('it'), productId:it.productId, name:it.name.trim(), qty:Math.max(0,it.qty||0), unitPrice:Math.max(0,it.unitPrice||0), unitCost:Math.max(0,it.unitCost||0)})),
    discountType: orderFormState.discountType, discountValue: Math.max(0, orderFormState.discountValue||0),
    expenses: JSON.parse(JSON.stringify(orderFormState.expenses)),
    deposit: Math.max(0, orderFormState.deposit||0)
  };

  if(existing){
    const prevItemsSnapshot = JSON.parse(JSON.stringify(existing.items));
    const wasApplied = existing.stockApplied;
    const prevOrderNo = existing.orderNo;
    if(wasApplied) applyOrderStockDelta({items:prevItemsSnapshot, orderNo:prevOrderNo}, +1);
    Object.assign(existing, newOrderData);
    existing.updatedAt = new Date().toISOString();
    if(status !== 'cancelled'){ applyOrderStockDelta(existing, -1); existing.stockApplied = true; }
    else { existing.stockApplied = false; }
    showToast('تم تحديث الطلب ✅');
  } else {
    const orderNo = String(state.settings.nextOrderNo||1).padStart(4,'0');
    state.settings.nextOrderNo = (state.settings.nextOrderNo||1) + 1;
    const order = Object.assign({id:uid('ord'), orderNo, createdAt:new Date().toISOString(), stockApplied:false}, newOrderData);
    state.orders.push(order);
    if(status !== 'cancelled'){ applyOrderStockDelta(order, -1); order.stockApplied = true; }
    showToast('تم إنشاء الطلب ✨');
  }
  saveState();
  closeSheet('sheet-order-form');
  renderOrdersList();
  renderProductsView();
  if(renderers.home) renderers.home();
  if(renderers.stats) renderers.stats();
}

/* ==================== SECTION: STATISTICS ==================== */
const AR_MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let statsPeriod = 'month'; // day | month | year | all
let statsChartInstance = null;

function getOrdersForPeriod(period){
  const now = new Date();
  const curMonthKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const curYearKey = String(now.getFullYear());
  return state.orders.filter(o=>{
    if(o.status==='cancelled') return false;
    if(period==='day') return dateOnly(o.date) === todayStr();
    if(period==='month') return monthKey(o.date) === curMonthKey;
    if(period==='year') return yearKey(o.date) === curYearKey;
    return true;
  });
}

      <button type="button" data-p="year" class="${statsPeriod==='year'?'active':''}">السنة</button>

      <canvas id="stats-canvas" height="170"></canvas>
    </div>

function renderStatsBody(){
  const orders = getOrdersForPeriod(statsPeriod);
  const totalSales = orders.reduce((s,o)=> s+computeOrderTotals(o).customerTotal, 0);
  const totalProfit = orders.reduce((s,o)=> s+computeOrderTotals(o).netProfit, 0);
  const totalItemsCost = orders.reduce((s,o)=> s+computeOrderTotals(o).itemsCost, 0);
  const totalExtraExp = orders.reduce((s,o)=> s+computeOrderTotals(o).extraExpenses, 0);

  document.getElementById('stats-cards').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="lbl">💵 المبيعات</div><div class="val pink">${fmtMoney(totalSales)}</div></div>
      <div class="stat-card purple"><div class="lbl">🪙 الأرباح الصافية</div><div class="val profit">${fmtMoney(totalProfit)}</div></div>
      <div class="stat-card"><div class="lbl">💸 المصاريف الإضافية</div><div class="val">${fmtMoney(totalExtraExp)}</div></div>
      <div class="stat-card purple"><div class="lbl">🛒 عدد الطلبات</div><div class="val purple">${orders.length}</div></div>
    </div>
    <div class="lineitem"><span class="muted">تكلفة المنتجات (البضاعة)</span><span class="amt">${fmtMoney(totalItemsCost)}</span></div>
    <div class="rule" style="margin:8px 0 4px;"></div>`;

  renderStatsChart(orders);
  renderTopProducts(orders);
}

function renderStatsChart(orders){
  const card = document.getElementById('stats-chart-card');
  if(statsPeriod === 'day'){ card.style.display='none'; return; }
  if(typeof Chart === 'undefined'){ card.style.display='none'; return; }
  card.style.display='block';

  let labels=[], values=[];
  try{
  if(statsPeriod === 'month'){
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const curMonthKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    labels = Array.from({length:daysInMonth}, (_,i)=> String(i+1));
    values = Array.from({length:daysInMonth}, ()=>0);
    orders.forEach(o=>{
      if(monthKey(o.date)===curMonthKey){
        const day = parseInt(dateOnly(o.date).slice(8,10),10);
        if(day>=1 && day<=daysInMonth) values[day-1] += computeOrderTotals(o).customerTotal;
      }
    });
  } else if(statsPeriod === 'year'){
    const curYear = new Date().getFullYear();
    labels = AR_MONTHS.slice();
    values = Array.from({length:12}, ()=>0);
    orders.forEach(o=>{
      const y = parseInt(yearKey(o.date),10);
      const m = parseInt(monthKey(o.date).slice(5,7),10);
      if(y===curYear && m>=1 && m<=12) values[m-1] += computeOrderTotals(o).customerTotal;
    });
  } else {
    const years = Array.from(new Set(state.orders.filter(o=>o.status!=='cancelled').map(o=>yearKey(o.date)))).sort();
    labels = years.length?years:[String(new Date().getFullYear())];
    values = labels.map(y=> orders.filter(o=>yearKey(o.date)===y).reduce((s,o)=>s+computeOrderTotals(o).customerTotal,0));
  }

  const ctx = document.getElementById('stats-canvas').getContext('2d');
  if(statsChartInstance) statsChartInstance.destroy();
  statsChartInstance = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data: values, backgroundColor:'rgba(238,31,121,.6)', borderRadius:7, maxBarThickness:26 }] },
    options:{
      plugins:{legend:{display:false}, tooltip:{rtl:true}},
      scales:{ x:{grid:{display:false}, ticks:{font:{size:9}}}, y:{grid:{color:'#f3e4fc'}, ticks:{font:{size:9}}} }
    }
  });
  }catch(e){ card.style.display='none'; }
}

function renderTopProducts(orders){
  const map = {};
  orders.forEach(o=> o.items.forEach(i=>{
    const key = i.productId || ('custom:'+i.name);
    if(!map[key]) map[key] = {name:i.name, qty:0, revenue:0};
    map[key].qty += Number(i.qty)||0;
    map[key].revenue += (Number(i.qty)||0)*(Number(i.unitPrice)||0);
  }));
  const top = Object.values(map).sort((a,b)=> b.qty-a.qty).slice(0,5);
  const el = document.getElementById('stats-top-products');
  if(!top.length){ el.innerHTML = `<div class="empty-state" style="padding:14px;"><span class="ic">🏆</span><div class="msg">لا توجد مبيعات في هذه الفترة</div></div>`; return; }
  el.innerHTML = `<table class="table-mini"><thead><tr><th>#</th><th>المنتج</th><th>الكمية</th><th>الإيراد</th></tr></thead><tbody>
    ${top.map((p,idx)=> `<tr><td><span class="rank-badge">${idx+1}</span></td><td>${escapeHtml(p.name)}</td><td>${p.qty}</td><td>${fmtMoney(p.revenue)}</td></tr>`).join('')}
  </tbody></table>`;
}

function exportOrdersCsv(){
  if(!state.orders.length){ showToast('لا توجد طلبات للتصدير'); return; }
  const header = ['رقم الطلب','التاريخ','الزبون','الهاتف','الحالة','المجموع الفرعي','الخصم','الإجمالي','العربون','المتبقي','تكلفة المنتجات','مصاريف إضافية','الربح الصافي'];
  const rows = state.orders.map(o=>{
    const t = computeOrderTotals(o);
    const cust = o.customerSnapshot||{};
    return [o.orderNo, dateOnly(o.date), cust.name||'', cust.phone||'', statusLabel(o.status), t.subtotal, t.discount, t.customerTotal, t.deposit, t.remaining, t.itemsCost, t.extraExpenses, t.netProfit];
  });
  const csv = '\uFEFF' + [header, ...rows].map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  downloadFile('printy-orders-'+todayStr()+'.csv', csv, 'text/csv;charset=utf-8');
  showToast('تم تصدير الملف ✅');
}

function exportStatsReportPdf(){
  const orders = getOrdersForPeriod(statsPeriod);
  const totalSales = orders.reduce((s,o)=> s+computeOrderTotals(o).customerTotal, 0);
  const totalProfit = orders.reduce((s,o)=> s+computeOrderTotals(o).netProfit, 0);
  const totalExtraExp = orders.reduce((s,o)=> s+computeOrderTotals(o).extraExpenses, 0);
  const periodLabel = {day:'اليوم', month:'هذا الشهر', year:'هذه السنة', all:'كل الفترة'}[statsPeriod];
  const html = `<div style="font-family:Cairo,sans-serif; direction:rtl;">
    <h2>${escapeHtml(state.settings.shopName||'Printy')} — تقرير ${periodLabel}</h2>
    <p>عدد الطلبات: ${orders.length}</p>
    <p>إجمالي المبيعات: ${fmtDZDraw(totalSales)}</p>
    <p>إجمالي الأرباح: ${fmtDZDraw(totalProfit)}</p>
    <p>إجمالي المصاريف: ${fmtDZDraw(totalExtraExp)}</p>
    <table border="1" cellpadding="6" style="border-collapse:collapse; width:100%; font-size:12px; margin-top:12px;">
      <tr><th>رقم</th><th>التاريخ</th><th>الزبون</th><th>الإجمالي</th><th>الربح</th><th>الحالة</th></tr>
      ${orders.map(o=>{ const t=computeOrderTotals(o); const cust=o.customerSnapshot||{}; return `<tr><td>${o.orderNo}</td><td>${dateOnly(o.date)}</td><td>${escapeHtml(cust.name||'')}</td><td>${fmtDZDraw(t.customerTotal)}</td><td>${fmtDZDraw(t.netProfit)}</td><td>${statusLabel(o.status)}</td></tr>`; }).join('')}
    </table>
  </div>`;
  printHtml(html);
}

      <div class="stat-card" data-goto="orders"><div class="lbl">⏳ قيد التنفيذ</div><div class="val">${inProgress}</div></div>
      <div class="stat-card purple" data-goto="products" id="home-lowstock-card"><div class="lbl">⚠️ مخزون منخفض</div><div class="val ${lowStock.length?'':'purple'}" style="${lowStock.length?'color:var(--danger)':''}">${lowStock.length}</div></div>
    </div>

    <div class="quick-actions">
      <button class="qa-btn" id="qa-new-order"><span class="ic">🛒</span>طلب جديد</button>
      <button class="qa-btn" id="qa-new-product"><span class="ic">📦</span>منتج جديد</button>
      <button class="qa-btn" id="qa-new-customer"><span class="ic">👤</span>زبون جديد</button>
    </div>

    <div class="card">
      <div class="card-title"><h3>🧮 حاسبة تسعير سريعة</h3><span class="hint">تكلفة ← سعر مقترح</span></div>
      <div class="field"><label>تكلفة المنتج (دج)</label><input type="number" id="qc-cost" min="0" step="1" value="0"></div>
      <div class="row2">
        <div class="field"><label>طريقة الربح</label>
          <div class="seg" id="qc-seg"><button type="button" class="active" data-m="percent">نسبة %</button><button type="button" data-m="fixed">مبلغ ثابت</button></div>
        </div>
        <div class="field"><label id="qc-val-lbl">نسبة الربح (%)</label><input type="number" id="qc-val" min="0" step="1" value="30"></div>
      </div>
      <div class="total-block" style="margin-top:4px;">
        <div class="lineitem"><span class="muted">💡 سعر البيع المقترح</span><span class="amt" id="qc-price">0 دج</span></div>
        <div class="lineitem"><span class="muted profit-text" style="color:var(--profit);">🪙 ربحك</span><span class="amt" id="qc-profit" style="color:var(--profit);">0 دج</span></div>
      </div>
    </div>

    <div class="card-title" style="margin-top:4px;"><h3>🧾 آخر الطلبات</h3><span class="hint" id="goto-orders-link" style="cursor:pointer; color:var(--purple-deep); font-weight:800;">عرض الكل ←</span></div>
    <div id="home-recent-orders"></div>`;

  document.getElementById('home-lowstock-card').addEventListener('click', ()=>{ if(lowStock.length) productLowStockOnly = true; });
  wrap.querySelectorAll('[data-goto]').forEach(el=> el.addEventListener('click', ()=> switchTab(el.dataset.goto)));
  const homeBackupBtn = document.getElementById('home-backup-now');

    downloadFile('printy-backup-'+todayStr()+'.json', JSON.stringify(state,null,2), 'application/json');
    markBackupDone();
    showToast('تم تنزيل النسخة الاحتياطية ✅');
    renderHomeView();

  document.getElementById('goto-orders-link').addEventListener('click', ()=> switchTab('orders'));
  document.getElementById('qa-new-order').addEventListener('click', ()=> openOrderForm());
  document.getElementById('qa-new-product').addEventListener('click', ()=> openProductForm());

    const cost = parseFloat(document.getElementById('qc-cost').value)||0;
    const val = parseFloat(document.getElementById('qc-val').value)||0;

  document.getElementById('qc-val').addEventListener('input', updateQc);

    rlist.innerHTML = `<div class="empty-state"><span class="ic">🌸</span><div class="msg">أنشئي أول طلب في متجرك</div></div>`;

        <div class="li-end"><div class="li-amt">${fmtMoney(t.customerTotal)}</div></div>
      </div>`;
    }).join('');
    rlist.querySelectorAll('[data-open-order]').forEach(el=> el.addEventListener('click', ()=>{ switchTab('orders'); openOrderDetail(el.dataset.openOrder); }));
  }
}

  document.getElementById('set-restore-btn').addEventListener('click', ()=> document.getElementById('set-restore-input').click());

    const file = e.target.files[0];

    const reader = new FileReader();
    reader.readAsText(file, 'utf-8');
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object') throw new Error('bad file');

        };

        markBackupDone();
        applyTheme();

    state = defaultState();
    saveState();
    applyTheme();
    renderAll();
    showToast('تم! المتجر رجع نسخة جديدة ✨');
  });
}
function exportProductsCsv(){
  if(!state.products.length){ showToast('لا توجد منتجات للتصدير'); return; }
  const header = ['الاسم','التصنيف','تكلفة الشراء','سعر البيع','الكمية المتوفرة','حد التنبيه'];
  const rows = state.products.map(p=> [p.name, p.category||'', p.costPrice, p.sellPrice, p.stock, p.lowStockThreshold ?? state.settings.lowStockDefault]);
  const csv = '\uFEFF' + [header, ...rows].map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  downloadFile('printy-products-'+todayStr()+'.csv', csv, 'text/csv;charset=utf-8');
  showToast('تم تصدير الملف ✅');
}

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
